name: "PlayStation 5 Monitor & Energy Tracker"
slug: "ps5_monitor"
description: "Monitors PS5 power state, session history, and correlates smart plug energy metrics."
version: "1.0.4"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
homeassistant_api: true
hassio_api: true
map:
  - "config:rw"
services:
  - "mqtt:want"

options:
  ps5_ip: "192.168.1.60"
  poll_interval_seconds: 10
  debounce_seconds: 60
  smart_plug_power_sensor: ""
  smart_plug_energy_sensor: ""
  history_max_sessions: 20
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""

schema:
  ps5_ip: "str"
  poll_interval_seconds: "int(5,60)"
  debounce_seconds: "int(10,300)"
  smart_plug_power_sensor: "str?"
  smart_plug_energy_sensor: "str?"
  history_max_sessions: "int(5,100)"
  mqtt_host: "str?"
  mqtt_port: "int(1,65535)?"
  mqtt_user: "str?"
  mqtt_password: "password?"
