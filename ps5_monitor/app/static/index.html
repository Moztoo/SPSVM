<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1b26" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SPSVM // Omarchy PS5 Monitor</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      --om-bg: #1a1b26;
      --om-surface: #16161e;
      --om-elevated: #24283b;
      --om-border: #292e42;
      --om-focus: #7aa2f7;
      --om-text: #c0caf5;
      --om-muted: #565f89;
      --om-subtle: #787c99;
      --om-accent: #7aa2f7;
      --om-cyan: #7dcfff;
      --om-green: #9ece6a;
      --om-amber: #e0af68;
      --om-red: #f7768e;
      --om-purple: #bb9af7;
      --om-mono: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;
      --om-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--om-bg);
      color: var(--om-text);
      font-family: var(--om-sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .omarchy-desktop {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 12px;
      gap: 12px;
      max-width: 1680px;
      margin: 0 auto;
    }

    /* ============================================================
     * SURFACE 1: OMARCHY QUICKSHELL TOP BAR
     * ============================================================ */
    .om-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--om-surface);
      border: 1px solid var(--om-border);
      border-radius: 8px;
      padding: 7px 12px;
      font-family: var(--om-mono);
      font-size: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .om-bar-left, .om-bar-center, .om-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .om-launcher-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--om-elevated);
      color: var(--om-focus);
      border: 1px solid var(--om-focus);
      border-radius: 5px;
      padding: 4px 10px;
      font-family: var(--om-mono);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .om-launcher-btn:hover {
      background: var(--om-focus);
      color: var(--om-bg);
    }

    .om-ws-pills {
      display: inline-flex;
      gap: 4px;
    }

    .om-ws-pill {
      background: transparent;
      border: 1px solid var(--om-border);
      color: var(--om-subtle);
      border-radius: 5px;
      padding: 4px 9px;
      font-family: var(--om-mono);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .om-ws-pill:hover {
      border-color: var(--om-subtle);
      color: var(--om-text);
    }

    .om-ws-pill.active {
      background: var(--om-elevated);
      border-color: var(--om-focus);
      color: var(--om-text);
      font-weight: 700;
    }

    .om-status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--om-elevated);
      border: 1px solid var(--om-border);
      border-radius: 5px;
      padding: 4px 11px;
      font-size: 11px;
      font-weight: 700;
    }

    .om-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .om-dot.pulse {
      animation: omPulse 1.8s infinite;
    }

    @keyframes omPulse {
      0% { box-shadow: 0 0 0 0 rgba(158, 206, 106, 0.75); }
      70% { box-shadow: 0 0 0 7px rgba(158, 206, 106, 0); }
      100% { box-shadow: 0 0 0 0 rgba(158, 206, 106, 0); }
    }

    .om-widget-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--om-bg);
      border: 1px solid var(--om-border);
      color: var(--om-text);
      border-radius: 5px;
      padding: 4px 10px;
      font-family: var(--om-mono);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.14s ease;
      font-variant-numeric: tabular-nums;
    }

    .om-widget-btn:hover, .om-widget-btn.open {
      border-color: var(--om-focus);
      background: var(--om-elevated);
    }

    /* ============================================================
     * SURFACE 2: DROPDOWN PANELS
     * ============================================================ */
    .om-dropdown-panel {
      background: var(--om-surface);
      border: 1px solid var(--om-focus);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
      font-family: var(--om-mono);
      animation: omSlideDown 0.14s ease-out;
    }

    @keyframes omSlideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .om-dd-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--om-border);
      padding-bottom: 8px;
      margin-bottom: 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--om-focus);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .om-dd-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    .om-dd-cell {
      background: var(--om-bg);
      border: 1px solid var(--om-border);
      border-radius: 6px;
      padding: 9px 11px;
    }

    .om-dd-lbl {
      font-size: 10px;
      color: var(--om-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .om-dd-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--om-text);
      font-variant-numeric: tabular-nums;
    }

    .om-theme-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .om-theme-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--om-bg);
      border: 1px solid var(--om-border);
      color: var(--om-text);
      padding: 8px 14px;
      border-radius: 6px;
      font-family: var(--om-mono);
      font-size: 12px;
      cursor: pointer;
    }

    .om-theme-btn.active {
      border-color: var(--om-focus);
      background: var(--om-elevated);
      font-weight: 700;
    }

    /* ============================================================
     * SURFACE 3: TILED WINDOWS WORKSPACE
     * ============================================================ */
    .om-tiling-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
    }

    .om-tile {
      background: var(--om-surface);
      border: 1px solid var(--om-border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .om-tile.focused {
      border-color: var(--om-focus);
      box-shadow: inset 0 0 0 1px rgba(122, 162, 247, 0.14);
    }

    .om-tile-live { grid-column: span 5; }
    .om-tile-graph { grid-column: span 7; }
    .om-tile-analytics { grid-column: span 5; }
    .om-tile-log { grid-column: span 7; }

    @media (max-width: 1080px) {
      .om-tile-live, .om-tile-graph, .om-tile-analytics, .om-tile-log {
        grid-column: span 12;
      }
    }

    .om-tile-titlebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--om-border);
      padding-bottom: 9px;
      margin-bottom: 14px;
      font-family: var(--om-mono);
      font-size: 11px;
    }

    .om-win-path {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      color: var(--om-subtle);
    }

    .om-tile.focused .om-win-path {
      color: var(--om-focus);
    }

    .om-win-idx {
      background: var(--om-elevated);
      color: var(--om-text);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
    }

    .om-win-tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--om-bg);
      border: 1px solid var(--om-border);
      color: var(--om-subtle);
    }

    /* Tile 1: Live Session TUI */
    .om-live-hero {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: var(--om-bg);
      border: 1px solid var(--om-border);
      border-radius: 6px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }

    .om-clock-block .lbl {
      font-family: var(--om-mono);
      font-size: 10px;
      color: var(--om-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .om-clock-block .clock-val {
      font-family: var(--om-mono);
      font-size: 32px;
      font-weight: 800;
      color: var(--om-text);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
    }

    .om-power-block {
      text-align: right;
    }

    .om-power-block .p-val {
      font-family: var(--om-mono);
      font-size: 28px;
      font-weight: 800;
      color: var(--om-cyan);
      font-variant-numeric: tabular-nums;
    }

    .om-power-block .p-sub {
      font-family: var(--om-mono);
      font-size: 10px;
      color: var(--om-subtle);
    }

    .om-load-meter {
      margin-bottom: 14px;
    }

    .om-load-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--om-mono);
      font-size: 10px;
      color: var(--om-subtle);
      margin-bottom: 6px;
    }

    .om-load-track {
      width: 100%;
      height: 8px;
      background: var(--om-bg);
      border: 1px solid var(--om-border);
      border-radius: 4px;
      overflow: hidden;
    }

    .om-load-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--om-accent), var(--om-cyan));
      transition: width 0.35s ease;
    }

    .om-kv-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      font-family: var(--om-mono);
    }

    .om-kv-box {
      background: var(--om-bg);
      border: 1px solid var(--om-border);
      border-radius: 6px;
      padding: 10px 12px;
    }

    .om-kv-box .k {
      font-size: 10px;
      color: var(--om-muted);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .om-kv-box .v {
      font-size: 14px;
      font-weight: 700;
      color: var(--om-text);
      font-variant-numeric: tabular-nums;
    }

    /* Tile 2: SVG Power Graph */
    .om-range-group {
      display: inline-flex;
      gap: 4px;
    }

    .om-range-btn {
      background: var(--om-bg);
      border: 1px solid var(--om-border);
      color: var(--om-subtle);
      border-radius: 4px;
      padding: 3px 8px;
      font-family: var(--om-mono);
      font-size: 10px;
      cursor: pointer;
    }

    .om-range-btn:hover {
      color: var(--om-text);
      border-color: var(--om-subtle);
    }

    .om-range-btn.active {
      border-color: var(--om-focus);
      color: var(--om-focus);
      background: var(--om-elevated);
      font-weight: 700;
    }

    .om-chart-stats-bar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-family: var(--om-mono);
      font-size: 11px;
      margin-bottom: 10px;
      color: var(--om-subtle);
    }

    .om-svg-wrap {
      width: 100%;
      flex: 1;
      min-height: 220px;
      background: var(--om-bg);
      border: 1px solid var(--om-border);
      border-radius: 6px;
      padding: 6px;
      position: relative;
    }

    .om-svg-chart {
      width: 100%;
      height: 100%;
      min-height: 205px;
      display: block;
      cursor: crosshair;
    }

    /* Tile 3: Cumulative Analytics */
    .om-kpi-matrix {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
      font-family: var(--om-mono);
    }

    .om-kpi-cell {
      background: var(--om-bg);
      border: 1px solid var(--om-border);
      border-radius: 6px;
      padding: 11px 13px;
    }

    .om-kpi-cell .lbl {
      font-size: 10px;
      color: var(--om-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .om-kpi-cell .val {
      font-size: 21px;
      font-weight: 800;
      color: var(--om-text);
      font-variant-numeric: tabular-nums;
    }

    .om-kpi-cell .sub {
      font-size: 10px;
      color: var(--om-subtle);
      margin-top: 3px;
    }

    .om-mini-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      height: 105px;
      background: var(--om-bg);
      border: 1px solid var(--om-border);
      border-radius: 6px;
      padding: 12px 14px 8px 14px;
      font-family: var(--om-mono);
    }

    .om-mini-bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
    }

    .om-mini-bar-val {
      font-size: 9px;
      color: var(--om-subtle);
      margin-bottom: 3px;
    }

    .om-mini-bar-track {
      flex: 1;
      width: 100%;
      max-width: 26px;
      background: var(--om-surface);
      border-radius: 3px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }

    .om-mini-bar-fill {
      width: 100%;
      border-radius: 3px 3px 0 0;
    }

    .om-mini-bar-lbl {
      font-size: 9px;
      color: var(--om-muted);
      margin-top: 4px;
    }

    .om-empty-mini {
      background: var(--om-bg);
      border: 1px dashed var(--om-border);
      border-radius: 6px;
      padding: 24px;
      text-align: center;
      font-family: var(--om-mono);
      font-size: 11px;
      color: var(--om-muted);
    }

    /* Tile 4: TUI Session Log */
    .om-log-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .om-filter-input {
      flex: 1;
      background: var(--om-bg);
      border: 1px solid var(--om-border);
      border-radius: 5px;
      padding: 7px 11px;
      color: var(--om-text);
      font-family: var(--om-mono);
      font-size: 11px;
      outline: none;
    }

    .om-filter-input:focus {
      border-color: var(--om-focus);
    }

    .om-table-wrap {
      background: var(--om-bg);
      border: 1px solid var(--om-border);
      border-radius: 6px;
      flex: 1;
      max-height: 245px;
      overflow-y: auto;
      font-family: var(--om-mono);
    }

    table.om-tui-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    table.om-tui-table th {
      text-align: left;
      padding: 8px 11px;
      background: var(--om-elevated);
      color: var(--om-subtle);
      font-size: 10px;
      text-transform: uppercase;
      position: sticky;
      top: 0;
      border-bottom: 1px solid var(--om-border);
    }

    table.om-tui-table td {
      padding: 8px 11px;
      border-bottom: 1px solid var(--om-border);
      color: var(--om-text);
    }

    table.om-tui-table tr.om-row {
      cursor: pointer;
    }

    table.om-tui-table tr.om-row:hover,
    table.om-tui-table tr.om-row.selected {
      background: var(--om-elevated);
    }

    .om-badge-live {
      background: rgba(158, 206, 106, 0.16);
      color: var(--om-green);
      border: 1px solid var(--om-green);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
    }

    /* ============================================================
     * SURFACE 4: FULL-SCREEN OVERLAYS
     * ============================================================ */
    .om-overlay-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.8);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 64px 16px 24px 16px;
    }

    .om-modal {
      width: 100%;
      max-width: 640px;
      background: var(--om-surface);
      border: 1px solid var(--om-focus);
      border-radius: 10px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.75);
      overflow: hidden;
      font-family: var(--om-mono);
    }

    .om-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 15px;
      background: var(--om-elevated);
      border-bottom: 1px solid var(--om-border);
      font-size: 12px;
      font-weight: 700;
      color: var(--om-focus);
    }

    .om-cmd-search {
      width: 100%;
      background: var(--om-bg);
      border: none;
      border-bottom: 1px solid var(--om-border);
      padding: 13px 15px;
      color: var(--om-text);
      font-family: var(--om-mono);
      font-size: 13px;
      outline: none;
    }

    .om-cmd-list {
      max-height: 340px;
      overflow-y: auto;
      padding: 6px;
    }

    .om-cmd-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 11px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .om-cmd-item:hover, .om-cmd-item.active {
      background: var(--om-elevated);
      color: var(--om-focus);
    }

    .om-cmd-cat {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--om-bg);
      border: 1px solid var(--om-border);
      color: var(--om-subtle);
      margin-right: 8px;
    }

    .om-json-pre {
      margin: 0;
      padding: 14px;
      background: var(--om-bg);
      color: var(--om-cyan);
      font-size: 11px;
      max-height: 440px;
      overflow: auto;
    }

    /* Footer Status Strip */
    .om-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 7px 12px;
      background: var(--om-surface);
      border: 1px solid var(--om-border);
      border-radius: 6px;
      font-family: var(--om-mono);
      font-size: 10px;
      color: var(--om-muted);
    }

    .om-key {
      background: var(--om-elevated);
      border: 1px solid var(--om-border);
      color: var(--om-text);
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div id="app" class="omarchy-desktop"></div>

  <script>
    const OMARCHY_THEMES = {
      "tokyo-night": {
        id: "tokyo-night", label: "Tokyo Night", dot: "#7aa2f7",
        bg: "#1a1b26", surface: "#16161e", elevated: "#24283b", border: "#292e42", focus: "#7aa2f7",
        text: "#c0caf5", muted: "#565f89", subtle: "#787c99", accent: "#7aa2f7",
        cyan: "#7dcfff", green: "#9ece6a", amber: "#e0af68", red: "#f7768e", purple: "#bb9af7",
      },
      "catppuccin": {
        id: "catppuccin", label: "Catppuccin Mocha", dot: "#cba6f7",
        bg: "#1e1e2e", surface: "#181825", elevated: "#313244", border: "#45475a", focus: "#cba6f7",
        text: "#cdd6f4", muted: "#6c7086", subtle: "#9399b2", accent: "#89b4fa",
        cyan: "#89dceb", green: "#a6e3a1", amber: "#f9e2af", red: "#f38ba8", purple: "#cba6f7",
      },
      "gruvbox": {
        id: "gruvbox", label: "Gruvbox Dark", dot: "#fabd2f",
        bg: "#1d2021", surface: "#282828", elevated: "#3c3836", border: "#504945", focus: "#fabd2f",
        text: "#ebdbb2", muted: "#928374", subtle: "#a89984", accent: "#83a598",
        cyan: "#8ec07c", green: "#b8bb26", amber: "#fabd2f", red: "#fb4934", purple: "#d3869b",
      },
      "sony-ps5": {
        id: "sony-ps5", label: "PS5 Obsidian", dot: "#00f0ff",
        bg: "#090d16", surface: "#0d1322", elevated: "#162038", border: "#1e2f52", focus: "#00b4d8",
        text: "#f1f5f9", muted: "#64748b", subtle: "#94a3b8", accent: "#0070d1",
        cyan: "#00f0ff", green: "#10b981", amber: "#f59e0b", red: "#f43f5e", purple: "#818cf8",
      }
    };

    const state = {
      themeId: localStorage.getItem("omarchy_ps5_theme") || "tokyo-night",
      focusedTile: 1,
      activeDropdown: null,
      overlayMode: null,
      commandQuery: "",
      commandIdx: 0,
      logFilter: "",
      selectedSessionIdx: 0,
      inspectedSession: null,
      rangeHours: 12,
      telemetry: null,
      powerSeries: [],
      statusSeries: [],
      hoverPoint: null,
      kwhRateMxn: 3.25,
      probing: false,
    };

    if (!OMARCHY_THEMES[state.themeId]) state.themeId = "tokyo-night";

    function applyThemeVars() {
      const t = OMARCHY_THEMES[state.themeId];
      const r = document.documentElement.style;
      r.setProperty("--om-bg", t.bg);
      r.setProperty("--om-surface", t.surface);
      r.setProperty("--om-elevated", t.elevated);
      r.setProperty("--om-border", t.border);
      r.setProperty("--om-focus", t.focus);
      r.setProperty("--om-text", t.text);
      r.setProperty("--om-muted", t.muted);
      r.setProperty("--om-subtle", t.subtle);
      r.setProperty("--om-accent", t.accent);
      r.setProperty("--om-cyan", t.cyan);
      r.setProperty("--om-green", t.green);
      r.setProperty("--om-amber", t.amber);
      r.setProperty("--om-red", t.red);
      r.setProperty("--om-purple", t.purple);
    }

    async function fetchTelemetry() {
      try {
        const res = await fetch("./api/telemetry", { cache: "no-store" });
        if (res.ok) {
          state.telemetry = await res.json();
          render();
        }
      } catch (e) {
        console.warn("Telemetry poll error:", e);
      }
    }

    async function fetchHistory(hours = state.rangeHours) {
      try {
        const res = await fetch(`./api/history?hours=${hours}`, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          state.powerSeries = data.power_series || [];
          state.statusSeries = data.status_series || [];
          render();
        }
      } catch (e) {
        console.warn("History poll error:", e);
      }
    }

    async function triggerImmediateProbe() {
      if (state.probing) return;
      state.probing = true;
      render();
      try {
        const res = await fetch("./api/probe", { method: "POST" });
        if (res.ok) {
          state.telemetry = await res.json();
        }
      } catch (e) {
        console.warn("Probe trigger error:", e);
      } finally {
        state.probing = false;
        render();
      }
    }

    function formatClockHMS(startIso) {
      if (!startIso) return "00:00:00";
      const startMs = new Date(startIso).getTime();
      if (isNaN(startMs)) return "00:00:00";
      const diffSec = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
      const h = String(Math.floor(diffSec / 3600)).padStart(2, "0");
      const m = String(Math.floor((diffSec % 3600) / 60)).padStart(2, "0");
      const s = String(diffSec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function formatDurationShort(minutes) {
      const m = parseFloat(minutes) || 0;
      if (m <= 0) return "0m";
      if (m < 60) return `${Math.round(m)}m`;
      const h = Math.floor(m / 60);
      const rem = Math.round(m % 60);
      return `${h}h ${rem}m`;
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getDisplaySessions() {
      const t = state.telemetry;
      if (!t) return [];
      const list = [];
      const ps5 = t.ps5 || {};
      const sess = t.session || {};
      const elec = t.electrical || {};

      if (ps5.is_in_use && sess.current_session_started) {
        list.push({
          isLive: true,
          id: "LIVE",
          started_at: sess.current_session_started,
          ended_at: null,
          duration_minutes: sess.current_session_duration_minutes || 0,
          energy_kwh: sess.current_session_kwh || 0,
          avg_power_watts: elec.power_watts || 0,
        });
      }
      const recent = Array.isArray(sess.recent_sessions) ? sess.recent_sessions : [];
      const total = sess.total_sessions || recent.length;
      recent.forEach((s, idx) => {
        list.push({
          isLive: false,
          id: String(Math.max(1, total - idx)).padStart(2, "0"),
          started_at: s.started_at,
          ended_at: s.ended_at,
          duration_minutes: parseFloat(s.duration_minutes) || 0,
          energy_kwh: parseFloat(s.energy_kwh) || 0,
          avg_power_watts: parseFloat(s.avg_power_watts) || 0,
        });
      });

      const q = (state.logFilter || "").trim().toLowerCase();
      if (!q) return list;
      return list.filter((item) => {
        const dateStr = item.started_at ? new Date(item.started_at).toLocaleString().toLowerCase() : "";
        return (
          item.id.toLowerCase().includes(q) ||
          dateStr.includes(q) ||
          `${item.duration_minutes}m`.includes(q) ||
          `${item.energy_kwh}kwh`.includes(q)
        );
      });
    }

    function getCommands() {
      return [
        { id: "probe-now", category: "PROBE", label: "Trigger Immediate UDP 9302/987 Probe", hint: "POST /api/probe", action: () => { state.overlayMode = null; triggerImmediateProbe(); } },
        { id: "theme-tokyo", category: "THEME", label: "Switch Theme → Tokyo Night", hint: "tokyo-night", action: () => setTheme("tokyo-night") },
        { id: "theme-catppuccin", category: "THEME", label: "Switch Theme → Catppuccin Mocha", hint: "catppuccin", action: () => setTheme("catppuccin") },
        { id: "theme-gruvbox", category: "THEME", label: "Switch Theme → Gruvbox Dark", hint: "gruvbox", action: () => setTheme("gruvbox") },
        { id: "theme-sony", category: "THEME", label: "Switch Theme → PS5 Obsidian Blue", hint: "sony-ps5", action: () => setTheme("sony-ps5") },
        { id: "range-1h", category: "GRAPH", label: "Telemetry Range → Last 1 Hour", hint: "1H", action: () => setRange(1) },
        { id: "range-6h", category: "GRAPH", label: "Telemetry Range → Last 6 Hours", hint: "6H", action: () => setRange(6) },
        { id: "range-12h", category: "GRAPH", label: "Telemetry Range → Last 12 Hours", hint: "12H", action: () => setRange(12) },
        { id: "range-24h", category: "GRAPH", label: "Telemetry Range → Last 24 Hours", hint: "24H", action: () => setRange(24) },
        { id: "range-48h", category: "GRAPH", label: "Telemetry Range → Last 48 Hours", hint: "48H", action: () => setRange(48) },
        { id: "panel-power", category: "PANEL", label: "Open Electrical Smart Plug Dropdown", hint: "TVSocket W/V/A/Hz", action: () => { state.overlayMode = null; state.activeDropdown = "power"; render(); } },
        { id: "panel-net", category: "PANEL", label: "Open Network & DDP Protocol Dropdown", hint: "BE230 + UDP", action: () => { state.overlayMode = null; state.activeDropdown = "network"; render(); } },
        { id: "overlay-raw", category: "DEBUG", label: "Inspect Raw Telemetry JSON Payload", hint: "/api/telemetry", action: () => { state.overlayMode = "raw"; render(); } },
      ];
    }

    function getFilteredCommands() {
      const q = (state.commandQuery || "").trim().toLowerCase();
      const all = getCommands();
      if (!q) return all;
      return all.filter((c) => c.label.toLowerCase().includes(q) || c.category.toLowerCase().includes(q) || c.hint.toLowerCase().includes(q));
    }

    function setTheme(id) {
      if (!OMARCHY_THEMES[id]) return;
      state.themeId = id;
      localStorage.setItem("omarchy_ps5_theme", id);
      state.activeDropdown = null;
      state.overlayMode = null;
      applyThemeVars();
      render();
    }

    function cycleTheme() {
      const keys = Object.keys(OMARCHY_THEMES);
      const next = keys[(keys.indexOf(state.themeId) + 1) % keys.length];
      setTheme(next);
    }

    function setRange(hrs) {
      state.rangeHours = hrs;
      state.overlayMode = null;
      fetchHistory(hrs);
      render();
    }

    function buildPowerSvgChart(currentPower, theme) {
      const pts = state.powerSeries && state.powerSeries.length > 1
        ? state.powerSeries
        : [
            { t: Date.now() - 3600000, v: currentPower * 0.85 },
            { t: Date.now() - 1800000, v: currentPower * 0.95 },
            { t: Date.now(), v: currentPower },
          ];

      const W = 760;
      const H = 215;
      const padL = 44;
      const padR = 14;
      const padT = 18;
      const padB = 34;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const minT = pts[0].t;
      const maxT = Math.max(minT + 1, pts[pts.length - 1].t);
      const values = pts.map((p) => p.v);
      const maxV = Math.max(360, Math.ceil(Math.max(...values, currentPower, 100) / 50) * 50);
      const minV = 0;

      const avgV = values.length ? values.reduce((a, b) => a + b, 0) / values.length : 0;
      const peakV = values.length ? Math.max(...values) : currentPower;

      const toX = (t) => padL + ((t - minT) / (maxT - minT)) * plotW;
      const toY = (v) => padT + plotH - ((Math.min(maxV, Math.max(minV, v)) - minV) / (maxV - minV)) * plotH;

      const coords = pts.map((p) => ({ x: toX(p.t), y: toY(p.v), t: p.t, v: p.v }));
      const linePath = coords.map((c, idx) => `${idx === 0 ? "M" : "L"}${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const areaPath = `${linePath} L${coords[coords.length - 1].x.toFixed(1)},${(padT + plotH).toFixed(1)} L${coords[0].x.toFixed(1)},${(padT + plotH).toFixed(1)} Z`;

      const yTicks = [0, Math.round(maxV * 0.33), Math.round(maxV * 0.66), maxV];
      const gridLines = yTicks.map((val) => {
        const y = toY(val).toFixed(1);
        return `
          <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${theme.border}" stroke-dasharray="3,3" stroke-width="1" />
          <text x="${padL - 6}" y="${parseFloat(y) + 3}" text-anchor="end" fill="${theme.muted}" font-size="10" font-family="JetBrains Mono, monospace">${val}W</text>
        `;
      }).join("");

      const xTicks = [0, 0.25, 0.5, 0.75, 1].map((frac) => {
        const t = minT + frac * (maxT - minT);
        const x = (padL + frac * plotW).toFixed(1);
        const label = new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        return `<text x="${x}" y="${H - 8}" text-anchor="middle" fill="${theme.muted}" font-size="10" font-family="JetBrains Mono, monospace">${label}</text>`;
      }).join("");

      const avgY = toY(avgV).toFixed(1);
      const ribbonY = padT + plotH + 4;
      const ribbonSegments = coords.map((c, idx) => {
        if (idx === coords.length - 1) return "";
        const next = coords[idx + 1];
        const segW = Math.max(1.5, next.x - c.x + 0.5);
        let segColor = theme.border;
        if (c.v >= 100) segColor = theme.green;
        else if (c.v >= 15) segColor = theme.amber;
        return `<rect x="${c.x.toFixed(1)}" y="${ribbonY}" width="${segW.toFixed(1)}" height="5" fill="${segColor}" opacity="0.85" />`;
      }).join("");

      let hoverOverlay = "";
      if (state.hoverPoint) {
        const hp = state.hoverPoint;
        const hx = toX(hp.t);
        const hy = toY(hp.v);
        const timeLbl = new Date(hp.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        const tooltipX = hx > W - 150 ? hx - 128 : hx + 10;
        hoverOverlay = `
          <line x1="${hx.toFixed(1)}" y1="${padT}" x2="${hx.toFixed(1)}" y2="${padT + plotH}" stroke="${theme.cyan}" stroke-width="1" stroke-dasharray="2,2" />
          <circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="4.5" fill="${theme.cyan}" stroke="${theme.bg}" stroke-width="2" />
          <g transform="translate(${tooltipX.toFixed(1)}, ${padT + 6})">
            <rect x="0" y="0" width="118" height="38" rx="4" fill="${theme.surface}" stroke="${theme.focus}" stroke-width="1" opacity="0.95" />
            <text x="8" y="15" fill="${theme.cyan}" font-size="11" font-weight="700" font-family="JetBrains Mono, monospace">${hp.v.toFixed(1)} W</text>
            <text x="8" y="30" fill="${theme.subtle}" font-size="10" font-family="JetBrains Mono, monospace">@ ${timeLbl}</text>
          </g>
        `;
      }

      return {
        peakV,
        avgV,
        coords,
        W,
        svg: `
          <svg id="om-power-svg" viewBox="0 0 ${W} ${H}" class="om-svg-chart" preserveAspectRatio="none">
            <defs>
              <linearGradient id="omPowerGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="${theme.accent}" stop-opacity="0.42" />
                <stop offset="85%" stop-color="${theme.cyan}" stop-opacity="0.04" />
                <stop offset="100%" stop-color="${theme.bg}" stop-opacity="0.0" />
              </linearGradient>
            </defs>
            ${gridLines}
            <line x1="${padL}" y1="${avgY}" x2="${W - padR}" y2="${avgY}" stroke="${theme.purple}" stroke-dasharray="4,4" stroke-width="1" opacity="0.7" />
            <path d="${areaPath}" fill="url(#omPowerGrad)" />
            <path d="${linePath}" fill="none" stroke="${theme.accent}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />
            ${ribbonSegments}
            ${xTicks}
            ${hoverOverlay}
          </svg>
        `,
      };
    }

    function buildSessionMiniBars(sessions, theme) {
      const slice = sessions.slice(0, 8).reverse();
      if (slice.length === 0) {
        return `<div class="om-empty-mini">Sin sesiones completadas aún — sesión actual en monitoreo activo</div>`;
      }
      const maxDur = Math.max(30, ...slice.map((s) => s.duration_minutes || 1));
      return `
        <div class="om-mini-bars">
          ${slice.map((s) => {
            const pct = Math.min(100, Math.max(10, Math.round(((s.duration_minutes || 1) / maxDur) * 100)));
            const color = s.isLive ? theme.green : theme.accent;
            const lbl = s.isLive ? "LIVE" : `#${s.id}`;
            return `
              <div class="om-mini-bar-col" title="${lbl}: ${Math.round(s.duration_minutes)} min (${s.energy_kwh.toFixed(3)} kWh)">
                <div class="om-mini-bar-val">${Math.round(s.duration_minutes)}m</div>
                <div class="om-mini-bar-track">
                  <div class="om-mini-bar-fill" style="height:${pct}%; background:${color};"></div>
                </div>
                <div class="om-mini-bar-lbl">${lbl}</div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function render() {
      applyThemeVars();
      const theme = OMARCHY_THEMES[state.themeId];
      const t = state.telemetry || {};
      const ps5 = t.ps5 || {};
      const sess = t.session || {};
      const elec = t.electrical || {};
      const net = t.network || {};

      const psState = String(ps5.state || "off").toLowerCase();
      const isInUse = Boolean(ps5.is_in_use || psState === "awake");
      const currentPower = parseFloat(elec.power_watts) || 0;
      const voltage = parseFloat(elec.voltage) || 123.0;
      const currentAmp = parseFloat(elec.current_amps) || 0;
      const frequency = parseFloat(elec.frequency_hz) || 60.0;
      const apparentVA = voltage * currentAmp;
      const powerFactor = apparentVA > 0 ? Math.min(1.0, currentPower / apparentVA) : 0;
      const dailySocketEnergy = parseFloat(elec.daily_socket_kwh) || 0;
      const totalSocketEnergy = parseFloat(elec.total_socket_kwh) || 0;

      const hostName = ps5.host_name || "PS5-294";
      const hostId = ps5.host_id || "00E4219DF086";
      const ipAddress = ps5.ip_address || net.ip || "192.168.1.60";
      const macAddress = net.mac || "CC:6B:1E:A7:0A:5D";
      const sysRaw = String(ps5.system_version || "14230000");
      const sysFormatted = sysRaw.length >= 4 ? `${sysRaw.slice(0, 2)}.${sysRaw.slice(2, 4)}` : sysRaw;
      const wifiBand = net.wifi_band || "Wi-Fi 5GHz";
      const sigNum = parseFloat(net.signal_dbm) || -54;
      const wifiSignal = `${sigNum} dBm`;
      const sigQuality = Math.min(100, Math.max(15, Math.round((100 + sigNum) * 1.6)));
      const txMbps = net.tx_rate ? (parseFloat(net.tx_rate) / 1000000).toFixed(2) : "1.13";
      const rxMbps = net.rx_rate ? (parseFloat(net.rx_rate) / 1000000).toFixed(2) : "1.20";
      const trafficMb = net.traffic_usage ? Math.round(parseFloat(net.traffic_usage) / (1024 * 1024)) : 863;

      const sessionStarted = sess.current_session_started || null;
      const sessionDurationMin = parseFloat(sess.current_session_duration_minutes) || 0;
      const sessionKwh = parseFloat(sess.current_session_kwh) || 0;
      const totalSessions = parseInt(sess.total_sessions, 10) || 0;
      const totalPlayHours = parseFloat(sess.total_play_time_hours) || 0;
      const totalGamingKwh = parseFloat(sess.total_energy_kwh) || 0;

      let statusColor = theme.muted;
      let statusBadgeText = "OFF // UNREACHABLE";
      let httpCodeBadge = "UDP:TIMEOUT";
      if (psState === "awake") {
        statusColor = theme.green;
        statusBadgeText = "AWAKE // IN USE";
        httpCodeBadge = "UDP:9302 • 200 OK";
      } else if (psState === "standby") {
        statusColor = theme.amber;
        statusBadgeText = "STANDBY // REST MODE";
        httpCodeBadge = "UDP:987 • 620 STANDBY";
      }

      let loadProfile = "POWERED OFF";
      if (psState === "awake") {
        if (currentPower >= 220) loadProfile = "AAA GAMING LOAD";
        else if (currentPower >= 120) loadProfile = "ACTIVE MEDIA / OS";
        else loadProfile = "HOME MENU / IDLE";
      } else if (psState === "standby") {
        loadProfile = "REST MODE (620)";
      }

      const liveClockStr = isInUse && sessionStarted ? formatClockHMS(sessionStarted) : "00:00:00";
      const loadPct = Math.min(100, Math.round((currentPower / 360) * 100));
      const estSessionCost = (sessionKwh * state.kwhRateMxn).toFixed(2);
      const estTotalCost = (totalGamingKwh * state.kwhRateMxn).toFixed(2);
      const avgSessionMin = totalSessions > 0 ? Math.round((totalPlayHours * 60) / totalSessions) : Math.round(sessionDurationMin);

      const sessions = getDisplaySessions();
      const chartObj = buildPowerSvgChart(currentPower, theme);

      let dropdownHtml = "";
      if (state.activeDropdown === "power") {
        dropdownHtml = `
          <div class="om-dropdown-panel">
            <div class="om-dd-header">
              <span>⚡ ELECTRICAL TELEMETRY // SALA TVSOCKET (SHELLY)</span>
              <span>[ESC TO CLOSE]</span>
            </div>
            <div class="om-dd-grid">
              <div class="om-dd-cell"><div class="om-dd-lbl">Active Power</div><div class="om-dd-val" style="color:var(--om-cyan);">${currentPower.toFixed(1)} W</div></div>
              <div class="om-dd-cell"><div class="om-dd-lbl">Line Voltage</div><div class="om-dd-val">${voltage.toFixed(1)} V</div></div>
              <div class="om-dd-cell"><div class="om-dd-lbl">Current Draw</div><div class="om-dd-val">${currentAmp.toFixed(3)} A</div></div>
              <div class="om-dd-cell"><div class="om-dd-lbl">Apparent Power</div><div class="om-dd-val">${apparentVA.toFixed(1)} VA</div></div>
              <div class="om-dd-cell"><div class="om-dd-lbl">Power Factor / Freq</div><div class="om-dd-val">${powerFactor.toFixed(2)} PF · ${frequency.toFixed(1)} Hz</div></div>
              <div class="om-dd-cell"><div class="om-dd-lbl">Today / Total Energy</div><div class="om-dd-val" style="color:var(--om-green);">${dailySocketEnergy.toFixed(3)} / ${totalSocketEnergy.toFixed(2)} kWh</div></div>
            </div>
          </div>
        `;
      } else if (state.activeDropdown === "network") {
        dropdownHtml = `
          <div class="om-dropdown-panel">
            <div class="om-dd-header">
              <span>📶 NETWORK & DDP DISCOVERY // TP-LINK BE230 ROUTER</span>
              <span>[ESC TO CLOSE]</span>
            </div>
            <div class="om-dd-grid">
              <div class="om-dd-cell"><div class="om-dd-lbl">IPv4 (Static DHCP)</div><div class="om-dd-val" style="color:var(--om-cyan);">${ipAddress}</div></div>
              <div class="om-dd-cell"><div class="om-dd-lbl">MAC Address</div><div class="om-dd-val">${macAddress}</div></div>
              <div class="om-dd-cell"><div class="om-dd-lbl">Wi-Fi Band & RSSI</div><div class="om-dd-val">${wifiBand} (${wifiSignal} · ${sigQuality}%)</div></div>
              <div class="om-dd-cell"><div class="om-dd-lbl">PHY TX / RX Rate</div><div class="om-dd-val">${txMbps} / ${rxMbps} Mbps</div></div>
              <div class="om-dd-cell"><div class="om-dd-lbl">Router Traffic Usage</div><div class="om-dd-val">${trafficMb} MB</div></div>
              <div class="om-dd-cell"><div class="om-dd-lbl">DDP Status / Host ID</div><div class="om-dd-val" style="color:var(--om-green);">${httpCodeBadge} (${hostId})</div></div>
            </div>
          </div>
        `;
      } else if (state.activeDropdown === "theme") {
        dropdownHtml = `
          <div class="om-dropdown-panel">
            <div class="om-dd-header">
              <span>🎨 OMARCHY SYSTEM THEME ENGINE</span>
              <span>[SHORTCUT: t]</span>
            </div>
            <div class="om-theme-row">
              ${Object.values(OMARCHY_THEMES).map((th) => `
                <button class="om-theme-btn ${state.themeId === th.id ? "active" : ""}" data-theme-id="${th.id}">
                  <span class="om-dot" style="background:${th.dot};"></span>
                  <span>${th.label}</span>
                </button>
              `).join("")}
            </div>
          </div>
        `;
      }

      let overlayHtml = "";
      if (state.overlayMode === "launcher") {
        const cmds = getFilteredCommands();
        overlayHtml = `
          <div class="om-overlay-backdrop" id="om-backdrop">
            <div class="om-modal" onclick="event.stopPropagation()">
              <div class="om-modal-header">
                <span>󰐔 OMARCHY SPOTLIGHT // COMMAND PALETTE</span>
                <span>[ESC]</span>
              </div>
              <input type="text" id="om-cmd-input" class="om-cmd-search" placeholder="Type a command, theme, or time range..." value="${escapeHtml(state.commandQuery)}" />
              <div class="om-cmd-list">
                ${cmds.length > 0 ? cmds.map((c, i) => `
                  <div class="om-cmd-item ${i === state.commandIdx ? "active" : ""}" data-cmd-idx="${i}">
                    <div><span class="om-cmd-cat">${c.category}</span><span>${c.label}</span></div>
                    <span style="color:var(--om-muted); font-size:11px;">${c.hint}</span>
                  </div>
                `).join("") : `<div style="padding:18px; text-align:center; color:var(--om-muted);">No matching commands</div>`}
              </div>
            </div>
          </div>
        `;
      } else if (state.overlayMode === "session" && state.inspectedSession) {
        const s = state.inspectedSession;
        const cost = (s.energy_kwh * state.kwhRateMxn).toFixed(2);
        overlayHtml = `
          <div class="om-overlay-backdrop" id="om-backdrop">
            <div class="om-modal" onclick="event.stopPropagation()">
              <div class="om-modal-header">
                <span>🎮 SESSION INSPECTOR // #${s.id}</span>
                <button class="om-range-btn" id="btn-close-modal">ESC</button>
              </div>
              <div style="padding:16px;">
                <div class="om-dd-grid">
                  <div class="om-dd-cell"><div class="om-dd-lbl">Session Status</div><div class="om-dd-val" style="color:${s.isLive ? "var(--om-green)" : "var(--om-cyan)"};">${s.isLive ? "● ACTIVE IN-GAME" : "COMPLETED"}</div></div>
                  <div class="om-dd-cell"><div class="om-dd-lbl">Duration</div><div class="om-dd-val">${formatDurationShort(s.duration_minutes)} (${s.duration_minutes.toFixed(1)} min)</div></div>
                  <div class="om-dd-cell"><div class="om-dd-lbl">Energy Consumed</div><div class="om-dd-val" style="color:var(--om-cyan);">${s.energy_kwh.toFixed(3)} kWh</div></div>
                  <div class="om-dd-cell"><div class="om-dd-lbl">Average Power</div><div class="om-dd-val">${Math.round(s.avg_power_watts)} W</div></div>
                  <div class="om-dd-cell"><div class="om-dd-lbl">Started At</div><div class="om-dd-val" style="font-size:11px;">${s.started_at ? new Date(s.started_at).toLocaleString() : "--"}</div></div>
                  <div class="om-dd-cell"><div class="om-dd-lbl">Estimated CFE Cost</div><div class="om-dd-val" style="color:var(--om-green);">$${cost} MXN</div></div>
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (state.overlayMode === "raw") {
        overlayHtml = `
          <div class="om-overlay-backdrop" id="om-backdrop">
            <div class="om-modal" onclick="event.stopPropagation()">
              <div class="om-modal-header">
                <span>{ } RAW TELEMETRY API PAYLOAD</span>
                <button class="om-range-btn" id="btn-close-modal">ESC</button>
              </div>
              <pre class="om-json-pre">${escapeHtml(JSON.stringify(state.telemetry, null, 2))}</pre>
            </div>
          </div>
        `;
      }

      const appEl = document.getElementById("app");
      appEl.innerHTML = `
        <!-- 1. TOP QUICKSHELL BAR -->
        <div class="om-topbar">
          <div class="om-bar-left">
            <button class="om-launcher-btn" id="btn-launcher" title="Open Omarchy Spotlight Command Palette (⌘K or /)">
              <span>󰐔</span>
              <span>SPSVM // OMARCHY</span>
            </button>
            <div class="om-ws-pills">
              <button class="om-ws-pill ${state.focusedTile === 1 ? "active" : ""}" data-tile="1">[1:LIVE]</button>
              <button class="om-ws-pill ${state.focusedTile === 2 ? "active" : ""}" data-tile="2">[2:GRAPH]</button>
              <button class="om-ws-pill ${state.focusedTile === 3 ? "active" : ""}" data-tile="3">[3:STATS]</button>
              <button class="om-ws-pill ${state.focusedTile === 4 ? "active" : ""}" data-tile="4">[4:LOG]</button>
            </div>
          </div>

          <div class="om-bar-center">
            <div class="om-status-chip" style="border-color:${statusColor}; color:${statusColor};">
              <span class="om-dot ${isInUse ? "pulse" : ""}" style="background:${statusColor};"></span>
              <span>${statusBadgeText}</span>
              <span style="color:var(--om-subtle);">// ${hostName}</span>
            </div>
            ${isInUse ? `
              <div class="om-status-chip" style="color:var(--om-cyan);">
                <span>⏱</span>
                <span id="om-ticker-clock">${liveClockStr}</span>
                <span style="color:var(--om-muted);">|</span>
                <span>${sessionKwh.toFixed(3)} kWh</span>
              </div>
            ` : ""}
          </div>

          <div class="om-bar-right">
            <button class="om-widget-btn" id="btn-probe-now" title="Send immediate UDP probe to PS5">
              <span>${state.probing ? "⏳" : "📡"}</span>
              <span>${state.probing ? "PROBING..." : "PROBE"}</span>
            </button>
            <button class="om-widget-btn ${state.activeDropdown === "power" ? "open" : ""}" id="btn-dd-power">
              <span style="color:var(--om-amber);">⚡</span>
              <span>${currentPower.toFixed(1)}W</span>
              <span style="color:var(--om-muted);">·</span>
              <span>${voltage.toFixed(0)}V</span>
              <span>▾</span>
            </button>
            <button class="om-widget-btn ${state.activeDropdown === "network" ? "open" : ""}" id="btn-dd-net">
              <span style="color:var(--om-cyan);">📶</span>
              <span>${wifiSignal}</span>
              <span style="color:var(--om-muted);">·</span>
              <span>${ipAddress}</span>
              <span>▾</span>
            </button>
            <button class="om-widget-btn ${state.activeDropdown === "theme" ? "open" : ""}" id="btn-dd-theme">
              <span class="om-dot" style="background:${theme.dot};"></span>
              <span>${theme.label}</span>
              <span>▾</span>
            </button>
            <button class="om-widget-btn" id="btn-cmd-help" title="Spotlight Command Launcher (Shortcut: / or ⌘K)">
              <span>⌘K</span>
            </button>
          </div>
        </div>

        ${dropdownHtml}

        <!-- 3. TILED WINDOWS WORKSPACE -->
        <div class="om-tiling-grid">
          <!-- TILE [1]: LIVE SESSION -->
          <div class="om-tile om-tile-live ${state.focusedTile === 1 ? "focused" : ""}" data-focus-tile="1">
            <div class="om-tile-titlebar">
              <div class="om-win-path"><span class="om-win-idx">01</span><span>ps5://telemetry/live-session</span></div>
              <span class="om-win-tag" style="color:${statusColor}; border-color:${statusColor};">${httpCodeBadge}</span>
            </div>

            <div class="om-live-hero">
              <div class="om-clock-block">
                <div class="lbl">${isInUse ? "ACTIVE SESSION TIMER" : "CONSOLE IDLE / STANDBY"}</div>
                <div class="clock-val" id="om-live-clock" style="color:${isInUse ? "var(--om-green)" : "var(--om-muted)"};">${liveClockStr}</div>
              </div>
              <div class="om-power-block">
                <div class="p-val">${currentPower.toFixed(1)} <span style="font-size:13px;">W</span></div>
                <div class="p-sub">${voltage.toFixed(1)}V · ${currentAmp.toFixed(2)}A</div>
              </div>
            </div>

            <div class="om-load-meter">
              <div class="om-load-header">
                <span>LOAD PROFILE: <strong style="color:var(--om-cyan);">${loadProfile}</strong></span>
                <span>${loadPct}% OF 360W MAX</span>
              </div>
              <div class="om-load-track"><div class="om-load-fill" style="width:${loadPct}%;"></div></div>
            </div>

            <div class="om-kv-grid">
              <div class="om-kv-box"><div class="k">Session Energy</div><div class="v" style="color:var(--om-cyan);">${sessionKwh.toFixed(3)} kWh</div></div>
              <div class="om-kv-box"><div class="k">Est. Session Cost</div><div class="v" style="color:var(--om-green);">$${estSessionCost} MXN</div></div>
              <div class="om-kv-box"><div class="k">Host / Firmware</div><div class="v">${hostName} (FW ${sysFormatted})</div></div>
              <div class="om-kv-box"><div class="k">Network / RSSI</div><div class="v">${wifiBand} (${wifiSignal})</div></div>
            </div>
          </div>

          <!-- TILE [2]: SVG POWER GRAPH -->
          <div class="om-tile om-tile-graph ${state.focusedTile === 2 ? "focused" : ""}" data-focus-tile="2">
            <div class="om-tile-titlebar">
              <div class="om-win-path"><span class="om-win-idx">02</span><span>ps5://graphs/power-timeline (${state.rangeHours}H)</span></div>
              <div class="om-range-group">
                ${[1, 6, 12, 24, 48].map((hrs) => `<button class="om-range-btn ${state.rangeHours === hrs ? "active" : ""}" data-range="${hrs}">${hrs}H</button>`).join("")}
                <button class="om-range-btn" id="btn-refresh-graph" title="Refresh history">↻</button>
              </div>
            </div>

            <div class="om-chart-stats-bar">
              <span>NOW: <strong style="color:var(--om-cyan);">${currentPower.toFixed(1)} W</strong></span>
              <span>AVG (${state.rangeHours}H): <strong style="color:var(--om-purple);">${chartObj.avgV.toFixed(1)} W</strong></span>
              <span>PEAK (${state.rangeHours}H): <strong style="color:var(--om-amber);">${chartObj.peakV.toFixed(1)} W</strong></span>
              <span>SOCKET TODAY: <strong style="color:var(--om-green);">${dailySocketEnergy.toFixed(3)} kWh</strong></span>
            </div>

            <div class="om-svg-wrap">${chartObj.svg}</div>
          </div>

          <!-- TILE [3]: CUMULATIVE ANALYTICS -->
          <div class="om-tile om-tile-analytics ${state.focusedTile === 3 ? "focused" : ""}" data-focus-tile="3">
            <div class="om-tile-titlebar">
              <div class="om-win-path"><span class="om-win-idx">03</span><span>ps5://analytics/cumulative-matrix</span></div>
              <span class="om-win-tag">/data/sessions.json</span>
            </div>

            <div class="om-kpi-matrix">
              <div class="om-kpi-cell">
                <div class="lbl">Total Sessions</div>
                <div class="val">${totalSessions} <span style="font-size:12px; color:var(--om-green);">${isInUse ? "+1 LIVE" : ""}</span></div>
                <div class="sub">Avg: ${avgSessionMin} min / session</div>
              </div>
              <div class="om-kpi-cell">
                <div class="lbl">Total Play Time</div>
                <div class="val">${totalPlayHours.toFixed(1)} <span style="font-size:12px; color:var(--om-subtle);">hrs</span></div>
                <div class="sub">Active session: ${formatDurationShort(sessionDurationMin)}</div>
              </div>
              <div class="om-kpi-cell">
                <div class="lbl">Gaming Energy</div>
                <div class="val" style="color:var(--om-cyan);">${totalGamingKwh.toFixed(2)} <span style="font-size:12px;">kWh</span></div>
                <div class="sub">Est. Cost: $${estTotalCost} MXN</div>
              </div>
              <div class="om-kpi-cell">
                <div class="lbl">TVSocket Total</div>
                <div class="val" style="color:var(--om-amber);">${totalSocketEnergy.toFixed(2)} <span style="font-size:12px;">kWh</span></div>
                <div class="sub">PF: ${powerFactor.toFixed(2)} · ${frequency.toFixed(0)} Hz</div>
              </div>
            </div>

            ${buildSessionMiniBars(sessions, theme)}
          </div>

          <!-- TILE [4]: TUI SESSION LOG -->
          <div class="om-tile om-tile-log ${state.focusedTile === 4 ? "focused" : ""}" data-focus-tile="4">
            <div class="om-tile-titlebar">
              <div class="om-win-path"><span class="om-win-idx">04</span><span>ps5://history/session-log (${sessions.length})</span></div>
              <span class="om-win-tag">[j/k] Select · [Enter] Inspect</span>
            </div>

            <div class="om-log-toolbar">
              <input type="text" id="om-log-filter" class="om-filter-input" placeholder="Filter sessions by date, duration, or kWh..." value="${escapeHtml(state.logFilter)}" />
            </div>

            <div class="om-table-wrap">
              <table class="om-tui-table">
                <thead>
                  <tr><th>#ID</th><th>START</th><th>DURATION</th><th>ENERGY</th><th>AVG LOAD</th><th>STATUS</th></tr>
                </thead>
                <tbody>
                  ${sessions.length > 0 ? sessions.map((s, idx) => {
                    const isSel = idx === state.selectedSessionIdx;
                    const startDt = s.started_at ? new Date(s.started_at) : null;
                    const dateLbl = startDt && !isNaN(startDt.getTime())
                      ? `${startDt.toLocaleDateString([], { month: "short", day: "numeric" })} ${startDt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`
                      : "--";
                    return `
                      <tr class="om-row ${isSel ? "selected" : ""}" data-session-idx="${idx}">
                        <td style="color:var(--om-focus); font-weight:700;">#${s.id}</td>
                        <td>${dateLbl}</td>
                        <td>${formatDurationShort(s.duration_minutes)}</td>
                        <td style="color:var(--om-cyan);">${s.energy_kwh.toFixed(3)} kWh</td>
                        <td>${Math.round(s.avg_power_watts)} W</td>
                        <td>${s.isLive ? `<span class="om-badge-live">● ACTIVE</span>` : `<span style="color:var(--om-subtle);">SAVED</span>`}</td>
                      </tr>
                    `;
                  }).join("") : `<tr><td colspan="6" style="text-align:center; padding:24px; color:var(--om-muted);">No matching sessions found.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- 4. FOOTER SHORTCUT BAR -->
        <div class="om-footer">
          <div>
            <span>SPSVM STANDALONE APP v2.0</span> ·
            <span>DDP v00030010 (UDP 9302/987)</span> ·
            <span>HOST_ID: ${hostId}</span>
          </div>
          <div>
            <span class="om-key">1-4</span> Focus Window
            <span class="om-key">t</span> Cycle Theme
            <span class="om-key">j/k</span> Navigate Log
            <span class="om-key">/</span> Spotlight
            <span class="om-key">Esc</span> Close
          </div>
        </div>

        ${overlayHtml}
      `;

      bindEvents(chartObj, sessions);
    }

    function bindEvents(chartObj, sessions) {
      const on = (sel, evt, fn) => {
        const el = document.querySelector(sel);
        if (el) el.addEventListener(evt, fn);
      };

      on("#btn-launcher", "click", () => { state.overlayMode = state.overlayMode === "launcher" ? null : "launcher"; state.activeDropdown = null; render(); focusCmdInput(); });
      on("#btn-cmd-help", "click", () => { state.overlayMode = state.overlayMode === "launcher" ? null : "launcher"; state.activeDropdown = null; render(); focusCmdInput(); });
      on("#btn-probe-now", "click", () => triggerImmediateProbe());
      on("#btn-dd-power", "click", () => { state.activeDropdown = state.activeDropdown === "power" ? null : "power"; render(); });
      on("#btn-dd-net", "click", () => { state.activeDropdown = state.activeDropdown === "network" ? null : "network"; render(); });
      on("#btn-dd-theme", "click", () => { state.activeDropdown = state.activeDropdown === "theme" ? null : "theme"; render(); });
      on("#btn-refresh-graph", "click", () => fetchHistory(state.rangeHours));
      on("#om-backdrop", "click", () => { state.overlayMode = null; render(); });
      on("#btn-close-modal", "click", () => { state.overlayMode = null; render(); });

      document.querySelectorAll("[data-tile]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.focusedTile = parseInt(btn.getAttribute("data-tile"), 10) || 1;
          render();
        });
      });

      document.querySelectorAll("[data-focus-tile]").forEach((tile) => {
        tile.addEventListener("click", () => {
          const idx = parseInt(tile.getAttribute("data-focus-tile"), 10) || 1;
          if (state.focusedTile !== idx) {
            state.focusedTile = idx;
            document.querySelectorAll("[data-focus-tile]").forEach((t) => t.classList.remove("focused"));
            tile.classList.add("focused");
          }
        });
      });

      document.querySelectorAll("[data-theme-id]").forEach((btn) => {
        btn.addEventListener("click", () => setTheme(btn.getAttribute("data-theme-id")));
      });

      document.querySelectorAll("[data-range]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          setRange(parseInt(btn.getAttribute("data-range"), 10) || 12);
        });
      });

      const svgEl = document.querySelector("#om-power-svg");
      if (svgEl && chartObj.coords && chartObj.coords.length > 0) {
        svgEl.addEventListener("mousemove", (e) => {
          const rect = svgEl.getBoundingClientRect();
          if (rect.width <= 0) return;
          const relX = ((e.clientX - rect.left) / rect.width) * chartObj.W;
          let closest = chartObj.coords[0];
          let minDist = Math.abs(relX - closest.x);
          for (const c of chartObj.coords) {
            const dist = Math.abs(relX - c.x);
            if (dist < minDist) {
              minDist = dist;
              closest = c;
            }
          }
          if (!state.hoverPoint || state.hoverPoint.t !== closest.t) {
            state.hoverPoint = { t: closest.t, v: closest.v };
            render();
          }
        });
        svgEl.addEventListener("mouseleave", () => {
          if (state.hoverPoint) {
            state.hoverPoint = null;
            render();
          }
        });
      }

      const filterInp = document.querySelector("#om-log-filter");
      if (filterInp) {
        filterInp.addEventListener("input", (e) => {
          state.logFilter = e.target.value;
          state.selectedSessionIdx = 0;
          const caret = e.target.selectionStart;
          render();
          const newInp = document.querySelector("#om-log-filter");
          if (newInp) {
            newInp.focus();
            try { newInp.setSelectionRange(caret, caret); } catch (_) {}
          }
        });
      }

      document.querySelectorAll("[data-session-idx]").forEach((row) => {
        row.addEventListener("click", () => {
          const idx = parseInt(row.getAttribute("data-session-idx"), 10) || 0;
          state.selectedSessionIdx = idx;
          if (sessions[idx]) {
            state.inspectedSession = sessions[idx];
            state.overlayMode = "session";
            render();
          }
        });
      });

      const cmdInp = document.querySelector("#om-cmd-input");
      if (cmdInp) {
        cmdInp.addEventListener("input", (e) => {
          state.commandQuery = e.target.value;
          state.commandIdx = 0;
          const caret = e.target.selectionStart;
          render();
          const newCmd = document.querySelector("#om-cmd-input");
          if (newCmd) {
            newCmd.focus();
            try { newCmd.setSelectionRange(caret, caret); } catch (_) {}
          }
        });
      }

      const cmds = getFilteredCommands();
      document.querySelectorAll("[data-cmd-idx]").forEach((item) => {
        item.addEventListener("click", () => {
          const i = parseInt(item.getAttribute("data-cmd-idx"), 10) || 0;
          if (cmds[i]) cmds[i].action();
        });
      });
    }

    function focusCmdInput() {
      if (state.overlayMode === "launcher") {
        setTimeout(() => {
          const inp = document.querySelector("#om-cmd-input");
          if (inp) inp.focus();
        }, 20);
      }
    }

    // Keyboard-First Navigation
    window.addEventListener("keydown", (e) => {
      const activeEl = document.activeElement;
      const isTyping = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA");

      if (e.key === "Escape") {
        if (state.overlayMode || state.activeDropdown) {
          e.preventDefault();
          state.overlayMode = null;
          state.activeDropdown = null;
          render();
          return;
        }
        if (isTyping) {
          activeEl.blur();
          return;
        }
      }

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        state.overlayMode = state.overlayMode === "launcher" ? null : "launcher";
        state.commandQuery = "";
        state.commandIdx = 0;
        render();
        focusCmdInput();
        return;
      }

      if (state.overlayMode === "launcher") {
        const cmds = getFilteredCommands();
        if (e.key === "ArrowDown") {
          e.preventDefault();
          state.commandIdx = cmds.length ? (state.commandIdx + 1) % cmds.length : 0;
          render();
          focusCmdInput();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          state.commandIdx = cmds.length ? (state.commandIdx - 1 + cmds.length) % cmds.length : 0;
          render();
          focusCmdInput();
        } else if (e.key === "Enter" && cmds[state.commandIdx]) {
          e.preventDefault();
          cmds[state.commandIdx].action();
        }
        return;
      }

      if (isTyping) return;

      if (["1", "2", "3", "4"].includes(e.key)) {
        state.focusedTile = parseInt(e.key, 10);
        render();
      } else if (e.key === "t") {
        cycleTheme();
      } else if (e.key === "?" || e.key === "/") {
        e.preventDefault();
        state.overlayMode = "launcher";
        state.commandQuery = "";
        state.commandIdx = 0;
        render();
        focusCmdInput();
      } else if (e.key === "j" || e.key === "ArrowDown") {
        const sessions = getDisplaySessions();
        if (sessions.length > 0) {
          state.focusedTile = 4;
          state.selectedSessionIdx = Math.min(sessions.length - 1, state.selectedSessionIdx + 1);
          render();
        }
      } else if (e.key === "k" || e.key === "ArrowUp") {
        const sessions = getDisplaySessions();
        if (sessions.length > 0) {
          state.focusedTile = 4;
          state.selectedSessionIdx = Math.max(0, state.selectedSessionIdx - 1);
          render();
        }
      } else if (e.key === "Enter" && state.focusedTile === 4) {
        const sessions = getDisplaySessions();
        if (sessions[state.selectedSessionIdx]) {
          state.inspectedSession = sessions[state.selectedSessionIdx];
          state.overlayMode = "session";
          render();
        }
      }
    });

    // Live 1-second clock tick
    setInterval(() => {
      const t = state.telemetry;
      if (!t || !t.ps5 || !t.session) return;
      const isInUse = Boolean(t.ps5.is_in_use || String(t.ps5.state).toLowerCase() === "awake");
      const started = t.session.current_session_started;
      if (isInUse && started) {
        const hms = formatClockHMS(started);
        const c1 = document.getElementById("om-live-clock");
        const c2 = document.getElementById("om-ticker-clock");
        if (c1) c1.textContent = hms;
        if (c2) c2.textContent = hms;
      }
    }, 1000);

    // Initial render & periodic background sync
    render();
    fetchTelemetry();
    fetchHistory(state.rangeHours);
    setInterval(fetchTelemetry, 4000);
    setInterval(() => fetchHistory(state.rangeHours), 30000);
  </script>
</body>
</html>
